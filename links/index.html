    :root{--ink:#291239;--ink2:#442453;--muted:#7c7184;--gold:#c69a43;--paper:#fffdfa;--cream:#f7f2f8;--line:#e9e0ec}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:'DM Sans',Arial,sans-serif;color:var(--ink);
      background:radial-gradient(circle at 50% -10%,#eee5f3 0,var(--cream) 45%,var(--paper) 100%);
      display:flex;justify-content:center;padding:48px 16px 32px}
    .card{width:100%;max-width:440px;text-align:center}
    .avatar{width:104px;height:104px;border-radius:50%;object-fit:cover;border:3px solid #fff;
      box-shadow:0 0 0 2px var(--gold),0 10px 30px rgba(41,18,57,.18)}
    h1{font-family:'Manrope','DM Sans',sans-serif;font-size:24px;font-weight:800;margin:18px 0 4px}
    .tag{font-size:11px;letter-spacing:.16em;font-weight:700;color:var(--muted);margin:0 0 6px;text-transform:uppercase}
    .bio{font-size:14px;color:var(--ink2);margin:0 0 28px}
    .links{display:flex;flex-direction:column;gap:14px;list-style:none;padding:0;margin:0}
    .links a{display:flex;align-items:center;gap:14px;padding:15px 18px;border-radius:14px;
      background:#fff;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600;font-size:15px;
      box-shadow:0 2px 8px rgba(41,18,57,.06);transition:transform .15s,box-shadow .15s,border-color .15s}
    .links a:hover,.links a:focus-visible{transform:translateY(-2px);border-color:var(--gold);box-shadow:0 8px 20px rgba(41,18,57,.12);outline:none}
    .ico{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:#fff}
    .ico svg{width:20px;height:20px;fill:currentColor}
    .label{flex:1;text-align:left}
    .label small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
    .arrow{color:var(--muted);font-size:18px}
    .yt{background:#ff0000}.fb{background:#1877f2}.tg{background:#229ed9}.wa{background:#25d366}.web{background:var(--gold)}
    .links a.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
    .links a.primary small,.links a.primary .arrow{color:#d9cbe3}
    footer{margin-top:32px;font-size:12px;color:var(--muted)}
    footer a{color:var(--ink2)}
